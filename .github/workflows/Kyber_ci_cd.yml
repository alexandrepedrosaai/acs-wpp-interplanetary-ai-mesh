name: Kyber CI/CD

on:
  push:
    branches:
      - main

# Permissões explícitas para corrigir o erro 403
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Configuração do ambiente
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      # 3. Compilação do binário
      - name: Build Kyber binary
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      # 4. Upload do artefato
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyber-binary
          path: build/kyber-executable

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para criar o Release

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Baixar artefato gerado
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kyber-binary
          path: ./dist

      # 3. Criar Tag e Release automático
      - name: Create Tag and Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/kyber-executable
          tag_name: kyber-v1.0.${{ github.run_number }}
          name: Kyber Release v1.0.${{ github.run_number }}
          body: "Automated build of Kyber post-quantum binary."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
